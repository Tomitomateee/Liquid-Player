name: AFK Cinematic

on:
  push:
    paths:
      - 'afk-cinematic/**'
      - '.github/workflows/afk-cinematic.yml'
  pull_request:
    paths:
      - 'afk-cinematic/**'
      - '.github/workflows/afk-cinematic.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afk-cinematic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Show available dependency versions (on failure)
        if: failure()
        run: |
          echo "--- Cloth Config ---"
          curl -s https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-fabric/maven-metadata.xml | grep -o '<version>2[0-9][^<]*</version>' | tail -8
          echo "--- Mod Menu ---"
          curl -s https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml | grep -o '<version>1[5-9][^<]*</version>' | tail -8

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: afk-cinematic
          path: afk-cinematic/build/libs/afk-cinematic-*.jar

  # Starts a real Minecraft client with the mod, joins a world and quits. Fails if the game crashes,
  # which catches broken mixins that a compile can't see.
  client-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afk-cinematic
          path: artifact

      - name: Stage mod for test client
        run: |
          mkdir -p run/mods
          cp $(ls artifact/afk-cinematic-*.jar | grep -v sources) run/mods/

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Run MC test client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: 1.21.11
          modloader: fabric
          regex: .*fabric.*
          mc-runtime-test: fabric
          fabric-api: 0.141.6+1.21.11
          java: 21
